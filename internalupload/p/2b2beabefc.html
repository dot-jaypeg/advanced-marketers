!-- ===== HEADER ===== -->\n  <header style=\"display:flex; justify-content:space-between; align-items:flex-end; gap:24px; border-bottom:1px solid rgba(255,255,255,.18); padding-bottom:26px; flex-wrap:wrap;\">\n    <div style=\"max-width:760px;\">\n      <!-- logo lockup -->\n      <div style=\"display:flex; align-items:center; gap:15px; margin-bottom:26px;\">\n        <img src=\"fa0ca767-1efd-47f9-9557-4239f1258f95\" alt=\"Advanced Marketers\" style=\"height:32px; width:auto; display:block;\">\n        <span style=\"align-self:center; font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:4px; text-transform:uppercase; color:rgba(255,255,255,.42); border-left:1px solid rgba(255,255,255,.18); padding-left:13px;\">Construction<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:12px; letter-spacing:4px; text-transform:uppercase; color:var(--ac,#5B5FF7);\">Revenue First, Always<\u002Fdiv>\n      <h1 style=\"font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:clamp(44px,6.4vw,76px); line-height:.92; letter-spacing:-.5px; text-transform:uppercase; margin-top:12px;\">The Growth <span style=\"color:var(--ac,#5B5FF7); animation:amGlow 3.4s ease-in-out infinite;\">System<\u002Fspan><\u002Fh1>\n      <p style=\"font-size:16px; line-height:1.6; color:rgba(255,255,255,.62); margin-top:18px; max-width:660px;\">Three ways to grow a contracting business. Every tier owns the whole machine — <b style=\"color:#fff; font-weight:600;\">ads, site, CRM, follow-up<\u002Fb> — because leads are vanity. <b style=\"color:#fff; font-weight:600;\">Booked revenue is the only number that counts.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"text-align:right; flex-shrink:0;\">\n      <div style=\"display:inline-flex; align-items:center; gap:9px; border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:8px 15px; background:rgba(255,255,255,.02);\">\n        <span style=\"width:8px; height:8px; border-radius:999px; background:#FF3B3B; animation:amDot 1.9s ease-in-out infinite;\"><\u002Fspan>\n        <span style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:rgba(255,255,255,.62);\">Internal Sales Tool<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.42); margin-top:14px;\">Present by stage:<br><span style=\"color:rgba(255,255,255,.62);\">\"Where are you now — and where do you want to be?\"<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===== TIERS ===== -->\n  <section style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:34px;\">\n\n    <!-- Foundation -->\n    <article style=\"background:#0C0C10; border:1px solid rgba(255,255,255,.10); border-radius:18px; padding:28px 24px; display:flex; flex-direction:column;\">\n      <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,.42);\">Stage 01<\u002Fdiv>\n      <h2 style=\"font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:36px; letter-spacing:-.5px; text-transform:uppercase; margin-top:6px; line-height:1;\">Foundation<\u002Fh2>\n      <p style=\"font-size:15px; line-height:1.5; color:rgba(255,255,255,.62); margin-top:14px; min-height:46px;\">Get the machine built and the jobs flowing.<\u002Fp>\n      <div style=\"margin-top:18px; padding-top:18px; border-top:1px solid rgba(255,255,255,.10);\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:42px; letter-spacing:-1px; line-height:1;\">$3,500<span style=\"font-size:15px; font-weight:600; color:rgba(255,255,255,.42); letter-spacing:0;\"> /mo<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{ showI
